version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  google_fonts: ^6.2.1
  file_picker: ^10.3.10
  path_provider: ^2.0.15
  dio: ^5.9.1
  open_filex: ^4.3.0 # replacement for open_file
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1

  flutter_web_auth_2: ^4.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:



  uses-material-design: true


  assets:
    - assets/images/backgroundimg.jpg



